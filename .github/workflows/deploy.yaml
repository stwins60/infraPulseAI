    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Image
        run: |
          docker build -t feature/backend:stable -f backend/Dockerfile backend

  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: deploy
        run: docker compose up -d --build
    
