version: "3.9"

services:
  # ─── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: infrapulse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-infrapulse}
      POSTGRES_USER: ${POSTGRES_USER:-infrapulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-infrapulse_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-infrapulse}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - infrapulse_net

  # ─── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: infrapulse_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret} --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - infrapulse_net

  # ─── Backend API ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: infrapulse_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-infrapulse}:${POSTGRES_PASSWORD:-infrapulse_secret}@postgres:5432/${POSTGRES_DB:-infrapulse}
      - SYNC_DATABASE_URL=postgresql://${POSTGRES_USER:-infrapulse}:${POSTGRES_PASSWORD:-infrapulse_secret}@postgres:5432/${POSTGRES_DB:-infrapulse}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/2
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - infrapulse_net
    command: >
      sh -c "alembic upgrade head &&
             python -m app.scripts.seed_data &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"

  # ─── Celery Worker ────────────────────────────────────────────────────────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: infrapulse_celery
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-infrapulse}:${POSTGRES_PASSWORD:-infrapulse_secret}@postgres:5432/${POSTGRES_DB:-infrapulse}
      - SYNC_DATABASE_URL=postgresql://${POSTGRES_USER:-infrapulse}:${POSTGRES_PASSWORD:-infrapulse_secret}@postgres:5432/${POSTGRES_DB:-infrapulse}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/2
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - infrapulse_net
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4 -Q default,proxmox,alerts,notifications

  # ─── Celery Beat (Scheduler) ──────────────────────────────────────────────────
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: infrapulse_celery_beat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-infrapulse}:${POSTGRES_PASSWORD:-infrapulse_secret}@postgres:5432/${POSTGRES_DB:-infrapulse}
      - SYNC_DATABASE_URL=postgresql://${POSTGRES_USER:-infrapulse}:${POSTGRES_PASSWORD:-infrapulse_secret}@postgres:5432/${POSTGRES_DB:-infrapulse}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/2
    volumes:
      - ./backend:/app
      - celery_beat_data:/app/celerybeat
    depends_on:
      - celery_worker
    networks:
      - infrapulse_net
    command: celery -A app.workers.celery_app beat --loglevel=info --scheduler celery.beat:PersistentScheduler --schedule=/app/celerybeat/celerybeat-schedule

  # ─── Nginx (Frontend + Reverse Proxy) ─────────────────────────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: infrapulse_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
    networks:
      - infrapulse_net
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_logs:
    driver: local
  celery_beat_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  infrapulse_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
